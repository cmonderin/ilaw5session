<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DepEd ILAW Lesson Plan Generator</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- html-docx-js for native .docx generation -->
  <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.min.js"></script>
  
  <!-- FileSaver.js for file saving -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  
  <style>
    @media print {
      body {
        background-color: white !important;
        color: black !important;
      }
      .no-print {
        display: none !important;
      }
      .print-full-width {
        width: 100% !important;
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .print-table {
        border-collapse: collapse !important;
        width: 100% !important;
      }
      .print-table th, .print-table td {
        border: 1px solid #000 !important;
        padding: 6px !important;
        color: #000 !important;
      }
      @page {
        size: A4 landscape;
        margin: 10mm;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const DEFAULT_FORM_DATA = {
      lessonTitle: 'Verbs (Action Words)',
      learningArea: 'English / Language Arts',
      teacherName: 'CARLOS C. MONDERIN',
      gradeSection: 'Grade 7 – LOYALTY',
      noOfSessions: '5 Sessions',
      learningCompetency: 'The learner identifies and uses verbs correctly in sentences to express actions, states, and conditions.',
      contentStandard: 'The learner demonstrates understanding of English grammar conventions and sentence structure.',
      performanceStandard: 'The learner correctly constructs oral and written sentences using appropriate action verbs.',
      references: 'DepEd English Curriculum Guide, Learner\'s Material Module 2',
      aiDeclaration: 'Generated with the assistance of Gemini AI in compliance with DepEd DO 3 s.2026 Annex A for instructional design framing and activity structuring.',
      learnerContext: 'The class consists of Grade 7 learners with diverse language backgrounds. Most respond well to interactive visual games, roleplay, and sentence-building drills.'
    };

    // Deeply detailed offline template builder
    const buildOfflinePlan = (title, area, grade) => {
      const T = title?.trim() || "the Lesson Topic";
      const S = area?.trim() || "the Subject";
      const G = grade?.trim() || "the Class";

      return {
        sessions: [
          `Session 1: Definition & Identification of ${T}`,
          `Session 2: Classifications & Structural Rules of ${T}`,
          `Session 3: Guided Sentence Construction & Analysis`,
          `Session 4: Practical Workshop & Group Demonstration`,
          `Session 5: Timed Performance Task & Mastery Assessment`
        ],
        intentions: {
          learningObjectives: [
            `• Define ${T} in your own words and identify them in 5 sample sentences.\n• List 3 distinct characteristics of ${T} in ${S}.`,
            `• Differentiate regular vs. irregular structures of ${T}.\n• Formulate 5 correct examples adhering to standard rules.`,
            `• Analyze 5 given sentences and correct errors in ${T} usage.\n• Collaborate with peers to create a 3-sentence narrative.`,
            `• Construct a 1-page written output demonstrating proper application of ${T}.\n• Present output to class following visual and grammatical rubrics.`,
            `• Complete a 5-item evaluation test on ${T} with 80% accuracy.\n• Self-assess performance using the standard DepEd checklist.`
          ]
        },
        learningExperience: {
          preLesson: [
            `1. Diagnostic Prompt (3 mins): Write 3 actions on the board (e.g., Run, Jump, Write). Ask: "What do these words have in common?"\n2. Hook: Show a short 2-minute video/picture showing people performing daily tasks. Ask: "Can a sentence exist without an action word?"`,
            `1. Retrieval Drill (3 mins): Flashcards with 5 words from Session 1. Learners shout "ACTION" or "NOT ACTION".\n2. Scenario Prompt: "Imagine telling a friend how to cook rice without using any action words. Is it possible?"`,
            `1. Error Detection Warm-up (4 mins): Display on board: "She run to school yesterday." Ask: "What feels incorrect about this sentence and how do we fix it?"\n2. Group Check: Assign safety and materials officers per group.`,
            `1. Workshop Briefing (5 mins): Distribute Task Sheet 4. Read instructions aloud: "Each group will draft a 5-step instructional guide using active ${T}."\n2. Materials distribution and role assignment.`,
            `1. Quiet Review (5 mins): Allow learners 5 minutes to review their quick-reference summary sheets.\n2. Distribute Evaluation Sheet and clarify test rules.`
          ],
          flow: [
            `1. Direct Instruction (15 mins): Teacher presents definition, types, and examples of ${T} using slides/board.\n2. Board Drill (10 mins): Call 5 learners to underline ${T} in sample sentences.\n3. Guided Activity (15 mins): In pairs, learners complete Worksheet 1 (Underlining target words).\n4. Synthesis (5 mins): Teacher summarizes core rule: "${T} expresses action or state of being."`,
            `1. Interactive Mini-Lecture (15 mins): Teacher explains structural rules and classifications of ${T}.\n2. Board Practice (10 mins): Transform regular items into irregular forms as a class.\n3. Pair Work (15 mins): Learners complete Classification Matrix Worksheet 2.\n4. Quick Check (5 mins): Random call-out for 3 student responses.`,
            `1. Guided Analysis (15 mins): Teacher models step-by-step sentence correction on board.\n2. Collaborative Group Task (20 mins): Groups of 4 receive 5 jumbled or incorrect sentence cards to correct and arrange into a coherent paragraph.\n3. Group Reporting (10 mins): Representatives read corrected outputs.`,
            `1. Hands-on Execution (25 mins): Learners independently construct an original 1-page composition/output applying ${T}.\n2. Teacher Monitoring (15 mins): Teacher conducts floor walks, providing immediate corrective feedback.\n3. Peer Exchange (5 mins): Swap papers for initial peer review.`,
            `1. Test Execution (25 mins): Learners independently complete the 5-item summative assessment.\n2. Submission & Checking (15 mins): Exchange papers for guided class correction.\n3. Debriefing & Reflection (5 mins): Teacher highlights common correct items and areas for improvement.`
          ],
          learningResources: [
            `• ${S} Curriculum Guide (p. 45-48)\n• Printed Worksheet 1: Word Identification\n• Visual Concept Poster on ${T}\n• Whiteboard & Markers`,
            `• Reference Textbook Chapter 3\n• Printed Worksheet 2: Classification Matrix\n• Flashcards (20 vocabulary items)\n• Manila Paper`,
            `• Sentence Correction Task Cards (Set A & B)\n• Group Activity Envelopes\n• Chart Paper & Markers\n• Scoring Rubric Sheet`,
            `• Practical Workshop Task Sheet 4\n• Standard Composition Sheets\n• Output Evaluation Rubric\n• Highlighters`,
            `• Printed 5-Item Assessment Test Sheets\n• Answer Key Overlay\n• Student Self-Reflection Logs\n• DepEd Grading Sheet`
          ],
          opportunitiesForIntegration: [
            `• Language Arts: Enhancing sentence clarity and grammatical precision.\n• Values Education: Active listening and respectful collaboration during paired drills.`,
            `• Critical Thinking: Categorizing terms logically based on structural patterns.\n• Mathematics: Counting structural rules and calculating accuracy percentages.`,
            `• Communication Skills: Articulating thought processes clearly during group reporting.\n• Peer Mentoring: Stronger learners supporting group mates during analysis.`,
            `• Workplace Readiness: Producing clean, professional written outputs adhering to guidelines.\n• Time Management: Completing independent writing within allotted 25 minutes.`,
            `• Personal Integrity: Maintaining honesty and independence during formal evaluation.\n• Self-Regulation: Reflecting on personal learning gaps and areas to review.`
          ]
        },
        assessment: {
          formativeAssessment: [
            `EXPLICIT 5-ITEM IDENTIFICATION QUIZ:\nDirections: Read each sentence. Write the ${T} on your paper.\n1. "The diligent student writes her assignment every evening." -> Answer: writes\n2. "Filipino athletes compete proudly in international games." -> Answer: compete\n3. "Teachers prepare engaging lessons for their classes." -> Answer: prepare\n4. "Rain fell heavily across the province last night." -> Answer: fell\n5. "We celebrate our cultural heritage together." -> Answer: celebrate`,

            `EXPLICIT 5-ITEM MULTIPLE CHOICE QUIZ:\n1. Which word expresses an action in: "The birds fly high"?\n   A) The  B) birds  C) fly [KEY]  D) high\n2. Select the correct form to complete: "She _____ to school yesterday."\n   A) walk  B) walked [KEY]  C) walking  D) walks\n3. Identify the state-of-being word: "They are very polite."\n   A) They  B) are [KEY]  C) very  D) polite\n4. Which sentence contains an action word?\n   A) Clear water  B) Blue sky  C) Students read books [KEY]  D) Green trees\n5. Choose the appropriate word: "The chef _____ a delicious meal."\n   A) cooks [KEY]  B) spoon  C) kitchen  D) plate`,

            `EXPLICIT 5-ITEM ERROR CORRECTION DRILL:\nDirections: Rewrite each sentence correcting the underlined error.\n1. "He play basketball every Saturday." -> Key: He plays basketball every Saturday.\n2. "They was happy about the results." -> Key: They were happy about the results.\n3. "She write a letter to her grandmother yesterday." -> Key: She wrote a letter to her grandmother yesterday.\n4. "The cat catch the mouse quickly." -> Key: The cat caught / catches the mouse quickly.\n5. "We is ready for the upcoming exam." -> Key: We are ready for the upcoming exam.`,

            `EXPLICIT 5-POINT PERFORMANCE TASK RUBRIC:\nEvaluate student composition based on:\n1. Grammatical Accuracy of ${T} (2 pts): All target words used correctly.\n2. Sentence Structure (1 pt): Complete sentences with proper capitalization.\n3. Content Alignment (1 pt): Directly answers prompt topic.\n4. Timeliness (1 pt): Output submitted within allotted 25 minutes.\nTotal Score: / 5 Points`,

            `EXPLICIT 5-ITEM SUMMATIVE EVALUATION:\n1. Define ${T} in 1 sentence. (Key: A word used to describe an action, state, or occurrence.)\n2. Underline the action word: "The dog barked loudly at strangers." (Key: barked)\n3. Change "sing" into past tense. (Key: sang)\n4. Fill in: "Farmers _____ crops to feed the nation." (Key: plant / grow)\n5. Write 1 original sentence using the word "study". (Key: Evaluated via rubric)`
          ]
        },
        waysForward: {
          extendedLearning: [
            `• Remediation Task: Provide Worksheet 1-B (5 guided fill-in-the-blank items with word bank) for learners scoring 2 below benchmark.\n• Enrichment Task: Write a 3-sentence diary entry about your morning routine, underlining all action words used.`,
            `• Remediation Task: Peer mentoring session pairing proficient students with struggling peers during 10-minute break.\n• Enrichment Task: Find 5 action words in a news article and list their base forms.`,
            `• Remediation Task: Teacher conducts a 10-minute small-group table guided review focusing on basic subject-verb alignment.\n• Enrichment Task: Draft a 5-line poem using at least 4 dynamic action words.`,
            `• Remediation Task: Complete guided paragraph completion sheet with visual prompts.\n• Enrichment Task: Transform a passive story paragraph into active voice using vivid action words.`,
            `• Remediation Task: Re-take targeted 3-item oral check during consultation hours.\n• Enrichment Task: Compile all corrected worksheets and reflection logs into an organized portfolio folder.`
          ],
          reflections: ["", "", "", "", ""]
        }
      };
    };

    function App() {
      const [formData, setFormData] = useState(DEFAULT_FORM_DATA);
      
      // Initialize with populated data immediately
      const [planData, setPlanData] = useState(() => 
        buildOfflinePlan(DEFAULT_FORM_DATA.lessonTitle, DEFAULT_FORM_DATA.learningArea, DEFAULT_FORM_DATA.gradeSection)
      );
      
      const [loading, setLoading] = useState(false);
      const [showDonateModal, setShowDonateModal] = useState(false);

      const [userApiKey, setUserApiKey] = useState(() => {
        return localStorage.getItem('deped_gemini_key') || '';
      });

      const handleApiKeyChange = (e) => {
        const key = e.target.value;
        setUserApiKey(key);
        localStorage.setItem('deped_gemini_key', key);
      };

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const handleRefresh = () => {
        window.location.reload();
      };

      const generatePlan = async () => {
        setLoading(true);

        // API Key Live Generation Mode
        if (userApiKey && userApiKey.trim() !== '') {
          try {
            const systemInstruction = `You are an expert DepEd Instructional Designer creating an official DepEd ILAW Lesson Plan (DepEd Order No. 3 s.2026).
CRITICAL REQUIREMENT: Make the output EXTREMELY DETAILED and STEP-BY-STEP so a substitute teacher can execute it verbatim.
- In "flow", include explicit minute breakdowns, teacher scripts, student actions, and board directions.
- In "preLesson", write out exact diagnostic prompts, video/picture hooks, and teacher questions.
- In "formativeAssessment", write the VERBATIM 5-item test questionnaires, full Answer Keys, and complete scoring rubrics for each session.

Return ONLY raw JSON matching this format:
{
  "sessions": ["Session 1: [Specific Topic]", "Session 2: [Specific Topic]", "Session 3: [Specific Topic]", "Session 4: [Specific Topic]", "Session 5: [Specific Topic]"],
  "intentions": {
    "learningObjectives": ["Detailed Obj 1", "Detailed Obj 2", "Detailed Obj 3", "Detailed Obj 4", "Detailed Obj 5"]
  },
  "learningExperience": {
    "preLesson": ["Detailed hook & questions 1", "Detailed hook & questions 2", "Detailed hook & questions 3", "Detailed hook & questions 4", "Detailed hook & questions 5"],
    "flow": ["Verbatim step-by-step 1", "Verbatim step-by-step 2", "Verbatim step-by-step 3", "Verbatim step-by-step 4", "Verbatim step-by-step 5"],
    "learningResources": ["Specific Res 1", "Specific Res 2", "Specific Res 3", "Specific Res 4", "Specific Res 5"],
    "opportunitiesForIntegration": ["Integration 1", "Integration 2", "Integration 3", "Integration 4", "Integration 5"]
  },
  "assessment": {
    "formativeAssessment": [
      "Verbatim 5-item quiz + Answer Key for Session 1",
      "Verbatim 5-item quiz + Answer Key for Session 2",
      "Verbatim 5-item quiz + Answer Key for Session 3",
      "Verbatim 5-item quiz + Answer Key for Session 4",
      "Verbatim 5-item quiz + Answer Key for Session 5"
    ]
  },
  "waysForward": {
    "extendedLearning": ["Remediation + Enrichment 1", "Remediation + Enrichment 2", "Remediation + Enrichment 3", "Remediation + Enrichment 4", "Remediation + Enrichment 5"],
    "reflections": ["", "", "", "", ""]
  }
}`;

            const userPrompt = `Generate a fully detailed, verbatim DepEd ILAW Lesson Plan for:
Topic / Lesson Title: ${formData.lessonTitle}
Subject/Learning Area: ${formData.learningArea}
Teacher: ${formData.teacherName}
Grade & Section: ${formData.gradeSection}
No. of Sessions: ${formData.noOfSessions}
Learning Competency: ${formData.learningCompetency}
Content Standard: ${formData.contentStandard}
Performance Standard: ${formData.performanceStandard}
Learner Context: ${formData.learnerContext}`;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${userApiKey.trim()}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                systemInstruction: { parts: [{ text: systemInstruction }] },
                contents: [{ parts: [{ text: userPrompt }] }],
                generationConfig: {
                  responseMimeType: "application/json",
                  temperature: 0.2
                }
              })
            });

            if (!response.ok) {
              const errJson = await response.json();
              console.warn("API Call Error, switching to detailed offline generator:", errJson);
            } else {
              const data = await response.json();
              const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
              if (rawText) {
                setPlanData(JSON.parse(rawText));
                setLoading(false);
                return;
              }
            }
          } catch (err) {
            console.warn("Network Error, executing fallback engine.", err);
          }
        }

        // Detailed Offline Generator Mode
        setTimeout(() => {
          setPlanData(buildOfflinePlan(formData.lessonTitle, formData.learningArea, formData.gradeSection));
          setLoading(false);
        }, 400);
      };

      const downloadDocx = () => {
        const tableElement = document.getElementById("ilaw-table-container");
        if (!tableElement) return;

        const content = `
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <style>
              body { font-family: Arial, sans-serif; font-size: 9pt; }
              table { border-collapse: collapse; width: 100%; margin-top: 10px; }
              td, th { border: 1px solid #000000; padding: 6px; font-size: 9pt; vertical-align: top; white-space: pre-line; }
              .bg-header { background-color: #E2E8F0; font-weight: bold; }
              .bg-sub { background-color: #F1F5F9; font-weight: bold; }
              h2 { text-align: center; font-size: 14pt; font-weight: bold; margin-bottom: 2px; }
              p.subtitle { text-align: center; font-size: 9pt; color: #475569; margin-top: 0; margin-bottom: 15px; }
            </style>
          </head>
          <body>
            <h2>LESSON PLAN TEMPLATE (OFFICIAL ILAW)</h2>
            <p class="subtitle">Department of Education - DepEd Order No. 3, s. 2026 Compliant Framework</p>
            ${tableElement.innerHTML}
          </body>
          </html>
        `;

        const converted = window.htmlDocx.asBlob(content, {
          orientation: 'landscape',
          margins: { top: 720, right: 720, bottom: 720, left: 720 }
        });

        const filename = `${(formData.lessonTitle || 'Lesson_Plan').replace(/[^a-zA-Z0-9]/g, '_')}_ILAW_Lesson_Plan.docx`;
        saveAs(converted, filename);
      };

      return (
        <div className="min-h-screen flex flex-col relative">
          <header className="bg-blue-900 text-white shadow-md py-4 px-6 no-print flex justify-between items-center">
            <div className="flex items-center gap-3">
              <div className="bg-yellow-400 text-blue-950 font-black px-3 py-1 rounded tracking-wider text-xl">DepEd</div>
              <div>
                <h1 className="text-xl font-bold">ILAW Lesson Plan Generator</h1>
                <p className="text-xs text-blue-200">Official DepEd Order No. 3, s. 2026 Compliant Format</p>
              </div>
            </div>
            
            <button 
              onClick={() => setShowDonateModal(true)}
              className="hidden sm:flex items-center gap-1.5 bg-blue-800 hover:bg-blue-700 text-yellow-300 border border-blue-600 text-xs py-1.5 px-3 rounded-lg font-semibold transition"
            >
              <span>☕</span> Buy the Dev Kape / Merienda
            </button>
          </header>

          <main className="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 p-6 max-w-[1700px] mx-auto w-full">
            {/* Input Form Controls */}
            <div className="lg:col-span-4 bg-white rounded-xl shadow-md border border-slate-200 p-5 space-y-4 no-print h-fit">
              <h2 className="text-lg font-bold text-slate-800 border-b pb-2">Lesson Inputs</h2>
              
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">Lesson Title</label>
                <input type="text" name="lessonTitle" value={formData.lessonTitle} onChange={handleChange} className="w-full text-sm p-2 bg-slate-50 border rounded outline-none focus:ring-1 focus:ring-blue-500" />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">Learning Area / Subject</label>
                <input type="text" name="learningArea" value={formData.learningArea} onChange={handleChange} className="w-full text-sm p-2 bg-slate-50 border rounded outline-none focus:ring-1 focus:ring-blue-500" />
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Teacher Name</label>
                  <input type="text" name="teacherName" value={formData.teacherName} onChange={handleChange} className="w-full text-sm p-2 bg-slate-50 border rounded outline-none focus:ring-1 focus:ring-blue-500" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Grade & Section</label>
                  <input type="text" name="gradeSection" value={formData.gradeSection} onChange={handleChange} className="w-full text-sm p-2 bg-slate-50 border rounded outline-none focus:ring-1 focus:ring-blue-500" />
                </div>
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">No. of Sessions</label>
                <input type="text" name="noOfSessions" value={formData.noOfSessions} onChange={handleChange} className="w-full text-sm p-2 bg-slate-50 border rounded outline-none focus:ring-1 focus:ring-blue-500" />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">Learning Competency</label>
                <textarea name="learningCompetency" rows="2" value={formData.learningCompetency} onChange={handleChange} className="w-full text-sm p-2 bg-slate-50 border rounded resize-none outline-none focus:ring-1 focus:ring-blue-500" />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">Content Standard</label>
                <textarea name="contentStandard" rows="2" value={formData.contentStandard} onChange={handleChange} className="w-full text-sm p-2 bg-slate-50 border rounded resize-none outline-none focus:ring-1 focus:ring-blue-500" />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">Performance Standard</label>
                <textarea name="performanceStandard" rows="2" value={formData.performanceStandard} onChange={handleChange} className="w-full text-sm p-2 bg-slate-50 border rounded resize-none outline-none focus:ring-1 focus:ring-blue-500" />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">Learner Context</label>
                <textarea name="learnerContext" rows="3" value={formData.learnerContext} onChange={handleChange} className="w-full text-sm p-2 bg-slate-50 border rounded resize-none outline-none focus:ring-1 focus:ring-blue-500" />
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">Gemini API Key (Optional for Live AI)</label>
                <input 
                  type="password" 
                  placeholder="Paste AI Studio key (Saved locally on browser)..." 
                  value={userApiKey} 
                  onChange={handleApiKeyChange} 
                  className="w-full text-xs p-2 bg-slate-50 border rounded outline-none focus:ring-1 focus:ring-blue-500" 
                />
                <p className="text-[10px] text-slate-500 mt-1">Leave blank to use the universal offline generator.</p>
              </div>

              {/* Action Buttons */}
              <div className="flex gap-2 pt-2">
                <button 
                  onClick={generatePlan} 
                  disabled={loading} 
                  className="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow transition flex items-center justify-center gap-1.5 text-xs sm:text-sm"
                >
                  {loading ? "Generating..." : "⚡ GENERATE ILAW LESSON PLAN"}
                </button>
                <button 
                  onClick={handleRefresh} 
                  type="button"
                  title="Reload Application Page"
                  className="px-4 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-lg shadow-sm transition text-xs sm:text-sm flex items-center gap-1"
                >
                  <span>↻</span> Refresh
                </button>
              </div>
            </div>

            {/* Document Preview Panel */}
            <div className="lg:col-span-8 flex flex-col print-full-width">
              <div className="bg-white p-4 rounded-t-xl border border-b-0 flex justify-between items-center no-print">
                <span className="font-bold text-slate-800">ILAW Table Preview</span>
                <div className="flex gap-2">
                  <button onClick={downloadDocx} className="bg-blue-600 hover:bg-blue-700 text-white text-xs px-4 py-2 rounded font-medium shadow-sm transition flex items-center gap-1">
                    <span>📄</span> Download as .docx
                  </button>
                  <button onClick={() => window.print()} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-4 py-2 rounded font-medium shadow-sm transition flex items-center gap-1">
                    <span>🖨️</span> Print / PDF
                  </button>
                </div>
              </div>

              <div className="bg-white border p-6 rounded-b-xl shadow-sm print-full-width overflow-x-auto">
                <div className="min-w-[700px]" id="ilaw-table-container">
                  <table className="w-full border-collapse border border-slate-800 text-xs print-table">
                    <tbody>
                      <tr><td className="border border-slate-800 font-bold p-2 bg-slate-50">Lesson Title</td><td className="border border-slate-800 p-2" colSpan="5">{formData.lessonTitle}</td></tr>
                      <tr><td className="border border-slate-800 font-bold p-2 bg-slate-50">Learning Area/s</td><td className="border border-slate-800 p-2" colSpan="5">{formData.learningArea}</td></tr>
                      <tr><td className="border border-slate-800 font-bold p-2 bg-slate-50">Name of Teacher/s</td><td className="border border-slate-800 p-2" colSpan="5">{formData.teacherName}</td></tr>
                      <tr><td className="border border-slate-800 font-bold p-2 bg-slate-50">Grade Level and Section</td><td className="border border-slate-800 p-2" colSpan="5">{formData.gradeSection}</td></tr>
                      <tr><td className="border border-slate-800 font-bold p-2 bg-slate-50">No. of Sessions</td><td className="border border-slate-800 p-2" colSpan="5">{formData.noOfSessions}</td></tr>
                      <tr><td className="border border-slate-800 font-bold p-2 bg-slate-50">References</td><td className="border border-slate-800 p-2" colSpan="5">{formData.references}</td></tr>
                      <tr><td className="border border-slate-800 font-bold p-2 bg-slate-50">Declaration of AI use</td><td className="border border-slate-800 p-2" colSpan="5">{formData.aiDeclaration}</td></tr>

                      <tr className="bg-slate-100"><td className="border border-slate-800 font-bold p-2 bg-header" colSpan="6">INTENTIONS.</td></tr>
                      <tr><td className="border border-slate-800 p-2 italic bg-slate-50" colSpan="6">Meaningful learning experiences are anchored in how we frame them. Start by deciding what you want learners to master by the end of the lesson - keep it clear and simple.</td></tr>
                      <tr>
                        <td className="border border-slate-800 font-bold p-2 bg-slate-50">Standards</td>
                        <td className="border border-slate-800 p-2" colSpan="5">
                          <strong>Competency:</strong> {formData.learningCompetency}<br />
                          <strong>Content:</strong> {formData.contentStandard}<br />
                          <strong>Performance:</strong> {formData.performanceStandard}
                        </td>
                      </tr>

                      <tr className="bg-slate-200 font-bold text-center">
                        <td className="border border-slate-800 p-2 bg-sub">Component</td>
                        {planData.sessions.map((s, i) => <td key={i} className="border border-slate-800 p-2 bg-sub">{s}</td>)}
                      </tr>

                      <tr>
                        <td className="border border-slate-800 font-bold p-2 bg-slate-50">Learning Objectives</td>
                        {planData.intentions.learningObjectives.map((item, i) => <td key={i} className="border border-slate-800 p-2 align-top whitespace-pre-line">{item}</td>)}
                      </tr>

                      <tr><td className="border border-slate-800 font-bold p-2 bg-slate-50">Learner Context</td><td className="border border-slate-800 p-2" colSpan="5">{formData.learnerContext}</td></tr>

                      <tr className="bg-slate-100"><td className="border border-slate-800 font-bold p-2 bg-header" colSpan="6">LEARNING EXPERIENCE.</td></tr>
                      <tr>
                        <td className="border border-slate-800 font-bold p-2 bg-slate-50">Pre-Lesson</td>
                        {planData.learningExperience.preLesson.map((item, i) => <td key={i} className="border border-slate-800 p-2 align-top whitespace-pre-line">{item}</td>)}
                      </tr>
                      <tr>
                        <td className="border border-slate-800 font-bold p-2 bg-slate-50">Flow</td>
                        {planData.learningExperience.flow.map((item, i) => <td key={i} className="border border-slate-800 p-2 align-top whitespace-pre-line">{item}</td>)}
                      </tr>
                      <tr>
                        <td className="border border-slate-800 font-bold p-2 bg-slate-50">Learning Resources</td>
                        {planData.learningExperience.learningResources.map((item, i) => <td key={i} className="border border-slate-800 p-2 align-top whitespace-pre-line">{item}</td>)}
                      </tr>
                      <tr>
                        <td className="border border-slate-800 font-bold p-2 bg-slate-50">Integration</td>
                        {planData.learningExperience.opportunitiesForIntegration.map((item, i) => <td key={i} className="border border-slate-800 p-2 align-top whitespace-pre-line">{item}</td>)}
                      </tr>

                      <tr className="bg-slate-100"><td className="border border-slate-800 font-bold p-2 bg-header" colSpan="6">ASSESSMENT.</td></tr>
                      <tr>
                        <td className="border border-slate-800 font-bold p-2 bg-slate-50">Formative Assessment</td>
                        {planData.assessment.formativeAssessment.map((item, i) => <td key={i} className="border border-slate-800 p-2 align-top whitespace-pre-line font-mono text-[11px] bg-slate-50">{item}</td>)}
                      </tr>

                      <tr className="bg-slate-100"><td className="border border-slate-800 font-bold p-2 bg-header" colSpan="6">WAYS FORWARD.</td></tr>
                      <tr>
                        <td className="border border-slate-800 font-bold p-2 bg-slate-50">Extended Learning</td>
                        {planData.waysForward.extendedLearning.map((item, i) => <td key={i} className="border border-slate-800 p-2 align-top whitespace-pre-line">{item}</td>)}
                      </tr>
                      <tr>
                        <td className="border border-slate-800 font-bold p-2 bg-slate-50">Reflections</td>
                        {planData.waysForward.reflections.map((item, i) => <td key={i} className="border border-slate-800 p-2 h-12"></td>)}
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </main>

          {/* Footer Banner */}
          <footer className="mt-8 mb-6 px-6 text-center no-print">
            <div className="max-w-xl mx-auto bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
              <p className="text-xs text-slate-700 leading-relaxed">
                ☕ <strong>Enjoying this free tool?</strong> Built by a fellow teacher to save us hours of DepEd paperwork. If this app helped you today, a small GCash token for coffee or snack is deeply appreciated! 
                <br />
                <span className="font-semibold text-blue-900 mt-1 inline-block">GCash: <span className="font-mono font-bold text-blue-700">09092593030</span> (Carlos C. Monderin)</span>
              </p>
            </div>
          </footer>

          {/* Floating Support Button */}
          <div className="fixed bottom-5 right-5 z-40 no-print">
            <button 
              onClick={() => setShowDonateModal(true)}
              className="bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs py-2.5 px-4 rounded-full shadow-lg transition flex items-center gap-2 border border-amber-300 transform hover:scale-105"
            >
              <span>☕</span>
              <span>Treat Dev to Coffee</span>
            </button>
          </div>

          {/* Support Modal */}
          {showDonateModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 no-print">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative border border-slate-100 text-center">
                <button 
                  onClick={() => setShowDonateModal(false)}
                  className="absolute top-3 right-3 text-slate-400 hover:text-slate-600 font-bold p-1 rounded-full text-base"
                >
                  ✕
                </button>

                <div className="text-3xl mb-1">💙</div>
                <h3 className="text-lg font-bold text-slate-800">Teachers Supporting Teachers</h3>
                <p className="text-xs text-slate-600 mt-2 leading-relaxed">
                  Hi! I'm <strong>Carlos C. Monderin</strong>. I created this web application to help fellow Filipino educators simplify their lesson preparation and save precious hours on paperwork.
                </p>
                <p className="text-xs text-slate-600 mt-2 leading-relaxed">
                  This tool will always remain <strong>100% free</strong>. If it brought ease to your teaching prep today and you'd like to chip in for coffee or merienda, any small amount is warmly appreciated!
                </p>

                <div className="bg-blue-50 border border-blue-200 rounded-xl p-4 my-4">
                  <span className="text-[10px] uppercase font-bold tracking-wider text-blue-600 block mb-1">GCash Support</span>
                  <div className="text-xl font-mono font-bold text-blue-950 tracking-wider">0909 259 3030</div>
                  <div className="text-xs font-semibold text-slate-700 mt-0.5">Carlos C. Monderin</div>
                </div>

                <p className="text-[11px] text-slate-400 italic">
                  Kahit simple prayer or thank you lang, sapat na po! Happy teaching! 🙏
                </p>

                <button 
                  onClick={() => setShowDonateModal(false)}
                  className="mt-4 w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs rounded-lg transition"
                >
                  Back to Planner
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
