<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DepEd ILAW Lesson Plan Generator (4As Approach)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- html-docx-js for native .docx generation -->
  <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.min.js"></script>
  
  <!-- FileSaver.js for file saving -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  
  <style>
    @media print {
      body {
        background-color: white !important;
        color: black !important;
      }
      .no-print {
        display: none !important;
      }
      .print-full-width {
        width: 100% !important;
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .print-table {
        border-collapse: collapse !important;
        width: 100% !important;
      }
      .print-table th, .print-table td {
        border: 1px solid #000 !important;
        padding: 6px !important;
        color: #000 !important;
      }
      @page {
        size: A4 landscape;
        margin: 10mm;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_FORM_DATA = {
      lessonTitle: 'Verbs (Action Words)',
      learningArea: 'English / Language Arts',
      teacherName: 'CARLOS C. MONDERIN',
      gradeSection: 'Grade 7 – LOYALTY',
      noOfSessions: '4 Sessions',
      learningCompetency: 'The learner identifies and uses verbs correctly in sentences to express actions, states, and conditions.',
      contentStandard: 'The learner demonstrates understanding of English grammar conventions and sentence structure.',
      performanceStandard: 'The learner correctly constructs oral and written sentences using appropriate action verbs.',
      references: 'DepEd English Curriculum Guide, Learner\'s Material Module 2',
      aiDeclaration: 'Generated with the assistance of Gemini AI in compliance with DepEd DO 3 s.2026 Annex A for instructional design framing and activity structuring.',
      learnerContext: 'The class consists of Grade 7 learners with diverse language backgrounds. Most respond well to interactive visual games, roleplay, and sentence-building drills.'
    };

    const pickRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const getRandomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

    // Dynamic Offline Joke Synthesizer
    const generateDynamicOfflineJoke = () => {
      const questions = [
        "Ano ang paboritong subject ng",
        "Bakit laging masaya ang",
        "Anong sabi ng",
        "Bakit hindi nalulungkot ang",
        "Ano ang tawag sa",
        "Bakit paborito ng mga guro ang",
        "Anong ulam ang paborito ng",
        "Bakit maagang gumigising ang"
      ];

      const subjects = [
        { item: "mga sapatos", pun: "Kasi marami silang SOLE-id choices! 👟" },
        { item: "calculator", pun: "Kasi lagi silang pwedeng COUNT-on sa hirap at ginhawa! 🧮" },
        { item: "whiteboard marker", pun: "Kasi alam nilang make a MARK sila sa puso ng students! 🖊️" },
        { item: "mga kape sa faculty room", pun: "Kasi match na match ang TIMING nila sa breaktime! ☕" },
        { item: "kalendaryo", pun: "Kasi puno ang taon nila ng masayang DATES! 📅" },
        { item: "mga geometry teacher", pun: "Kasi nakikita nila ang pananaw sa tamang RIGHT ANGLE! 📐" },
        { item: "mga laptop charger", pun: "Kasi full of ENERGY sila magturo! 🔋" },
        { item: "mga electric fan sa classroom", pun: "Kasi NUMBER ONE FAN sila ng mga estudyante! 🌬️" },
        { item: "mga papel sa desk", pun: "Kasi aligned sila sa tamang MARGINS! 📄" },
        { item: "mga compass sa Math class", pun: "Kasi guide sila to the RIGHT DIRECTION! 🧭" },
        { item: "mga bell sa eskwelahan", pun: "Kasi RING nang RING ang Good Vibes sa kanila! 🔔" },
        { item: "mga libro sa library", pun: "Kasi marami silang PAGES of wisdom! 📚" }
      ];

      return `${pickRandom(questions)} ${pickRandom(subjects).item}? Edi ${pickRandom(subjects).pun}`;
    };

    // Dynamic Multi-Session Offline Generation Engine with Strict KSA Objectives and 4As Approach
    const buildOfflinePlan = (title, area, grade, numSessionsText = "4 Sessions") => {
      const T = title?.trim() || "the Lesson Topic";
      const S = (area?.trim() || "").toLowerCase();
      const G = grade?.trim() || "the Class";
      const runId = Math.floor(Math.random() * 9000) + 1000;

      const count = parseInt(numSessionsText) || 4;

      const sessionFocusPool = [
        "Fundamentals & Definitions",
        "Structural Rules & Categories",
        "Guided Execution & Drills",
        "Practical Application & Workshop",
        "Summative Mastery Check & Evaluation"
      ];

      const sessions = Array.from({ length: count }, (_, i) => 
        `Session ${i + 1}: ${sessionFocusPool[i % sessionFocusPool.length]} of ${T}`
      );

      const ksaObjectivesPool = [
        `• Knowledge: Define ${T} and explain its core role in ${S}.\n• Skills: Identify target elements of ${T} in 5 practice items.\n• Attitude: Demonstrate active curiosity during class discussion.`,
        `• Knowledge: Differentiate primary categories and structural rules of ${T}.\n• Skills: Construct original sentences/problems adhering to standard formulas.\n• Attitude: Practice patience and accuracy during independent work.`,
        `• Knowledge: Analyze sample outputs to detect errors in ${T}.\n• Skills: Correct structural pitfalls in guided group worksheets.\n• Attitude: Show teamwork and respectful collaboration during group tasks.`,
        `• Knowledge: Synthesize key principles of ${T} into authentic scenarios.\n• Skills: Draft a complete workshop output demonstrating ${T}.\n• Attitude: Display pride and excellence in presenting final work.`,
        `• Knowledge: Recall foundational rules of ${T} under timed evaluation.\n• Skills: Execute formal 5-item assessment test with at least 80% accuracy.\n• Attitude: Maintain integrity and self-discipline during assessment.`
      ];

      const hookStyles = [
        `1. Visual Diagnostic (4 mins): Present 3 contrasting examples of ${T} on the board. Ask: "What structural patterns distinguish these examples?"\n2. Lesson Goal Briefing: Outline expected performance criteria.`,
        `1. Interactive Charade / Roleplay (4 mins): Call 2 volunteers to demonstrate a concept scenario involving ${T}.\n2. Guided Inquiry: Connect demonstration to today's competency.`,
        `1. Error Detection Challenge (4 mins): Display a text snippet containing deliberate errors in ${T}. Ask: "Who can spot and correct the mistakes?"\n2. Review rules.`,
        `1. Real-World Case Prompt (4 mins): Present a practical daily scenario in ${G} where ${T} is applied. Ask: "Why is accuracy critical in this context?"\n2. Group warm-up.`
      ];

      // Explicit 4As Flow Generator
      const generate4AFlow = (sessionIndex) => {
        const stepNum = sessionIndex + 1;
        return `• ACTIVITY (10 mins): Group Sorting Game - Distribute 5 task cards containing sample scenarios of ${T}. Learners classify cards on the board.\n` +
               `• ANALYSIS (10 mins): Guided Inquiry - Ask: "Why did you group Card #1 under Category A?" Teacher leads discussion on patterns discovered.\n` +
               `• ABSTRACTION (15 mins): Direct Mini-Lecture - Formally define ${T}, discuss standard rules, formulas, and common mistakes in ${S}.\n` +
               `• APPLICATION (10 mins): Pair Workshop - Pairs execute Task Sheet ${stepNum}, constructing original examples of ${T} for peer evaluation.`;
      };

      const quizPool = [
        `EXPLICIT 5-ITEM IDENTIFICATION QUIZ (Set #${runId}):\n1. Define ${T} in your own words.\n2. Identify core element in sample 1.\n3. Select correct usage: A) Option A [KEY] B) Option B\n4. True or False: ${T} is context dependent.\n5. Write 1 example of ${T}.`,
        `EXPLICIT 5-ITEM MULTIPLE CHOICE ASSESSMENT (Set #${runId}):\n1. Primary purpose of ${T}?\n   A) Primary [KEY] B) Secondary\n2. Complete statement: A) Form A [KEY] B) Form B\n3. Identify error in sentence #${getRandomInt(1, 5)}.\n4. Rule governing ${T}?\n5. Determine correct outcome.`,
        `EXPLICIT 5-ITEM ERROR CORRECTION DRILL (Set #${runId}):\n1. Rewrite item 1 -> Key: Corrected 1\n2. Rewrite item 2 -> Key: Corrected 2\n3. Rewrite item 3 -> Key: Corrected 3\n4. Rewrite item 4 -> Key: Corrected 4\n5. Rewrite item 5 -> Key: Corrected 5`,
        `EXPLICIT 5-POINT PERFORMANCE TASK RUBRIC (Set #${runId}):\n1. Accuracy of ${T} (2 pts)\n2. Formatting & Syntax (1 pt)\n3. Content Alignment (1 pt)\n4. Timeliness (1 pt)`,
        `EXPLICIT 5-ITEM SUMMATIVE MASTERY CHECK (Set #${runId}):\n1. State core rule of ${T}.\n2. Underline target word in text.\n3. Transform item to formal representation.\n4. Explain error in sample B.\n5. Construct 2-sentence output.`
      ];

      return {
        sessions: sessions,
        intentions: {
          learningObjectives: Array.from({ length: count }, (_, i) => ksaObjectivesPool[i % ksaObjectivesPool.length])
        },
        learningExperience: {
          preLesson: Array.from({ length: count }, () => pickRandom(hookStyles)),
          flow: Array.from({ length: count }, (_, i) => generate4AFlow(i)),
          learningResources: Array.from({ length: count }, (_, i) => 
            `• ${S} Curriculum Guide\n• Printed 4As Activity Cards ${i + 1}\n• Task Sheet & Board Markers`
          ),
          opportunitiesForIntegration: Array.from({ length: count }, () => 
            `• Communication Skills: Expressing ideas clearly during Analysis.\n• Critical Thinking: Deductive reasoning during Activity.`
          )
        },
        assessment: {
          formativeAssessment: Array.from({ length: count }, (_, i) => quizPool[i % quizPool.length])
        },
        waysForward: {
          extendedLearning: Array.from({ length: count }, (_, i) => 
            `• Remediation: Guided 4As Reinforcement Sheet ${i + 1}-B.\n• Enrichment: Advanced application challenge.`
          ),
          reflections: Array.from({ length: count }, () => "")
        }
      };
    };

    function App() {
      const [formData, setFormData] = useState(DEFAULT_FORM_DATA);
      const [hasGeneratedOnce, setHasGeneratedOnce] = useState(false);
      const [currentJoke, setCurrentJoke] = useState("Loading Good Vibes Joke...");
      const [jokeLoading, setJokeLoading] = useState(false);
      
      const [planData, setPlanData] = useState(() => 
        buildOfflinePlan(DEFAULT_FORM_DATA.lessonTitle, DEFAULT_FORM_DATA.learningArea, DEFAULT_FORM_DATA.gradeSection, DEFAULT_FORM_DATA.noOfSessions)
      );
      
      const [loading, setLoading] = useState(false);
      const [showDonateModal, setShowDonateModal] = useState(false);

      const [userApiKey, setUserApiKey] = useState(() => {
        return localStorage.getItem('deped_gemini_key') || '';
      });

      const fetchNewJoke = async () => {
        setJokeLoading(true);

        if (userApiKey && userApiKey.trim() !== '') {
          try {
            const prompt = `Give me 1 short, funny, wholesome Tagalog teacher or school-related one-liner joke with emojis. Do not add introductory text or quotes. Just the raw joke text. Random Seed: ${Date.now()}`;
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${userApiKey.trim()}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { temperature: 0.9, maxOutputTokens: 100 }
              })
            });

            if (response.ok) {
              const data = await response.json();
              const jokeText = data.candidates?.[0]?.content?.parts?.[0]?.text;
              if (jokeText) {
                setCurrentJoke(jokeText.trim());
                setJokeLoading(false);
                return;
              }
            }
          } catch (err) {
            console.warn("AI Joke fetch failed, falling back to dynamic generator.", err);
          }
        }

        setTimeout(() => {
          setCurrentJoke(generateDynamicOfflineJoke());
          setJokeLoading(false);
        }, 300);
      };

      useEffect(() => {
        fetchNewJoke();
      }, []);

      const handleApiKeyChange = (e) => {
        const key = e.target.value;
        setUserApiKey(key);
        localStorage.setItem('deped_gemini_key', key);
      };

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const handleRefresh = () => {
        window.location.reload();
      };

      const generatePlan = async () => {
        setLoading(true);
        setHasGeneratedOnce(true);
        const count = parseInt(formData.noOfSessions) || 4;

        if (userApiKey && userApiKey.trim() !== '') {
          try {
            const systemInstruction = `You are an expert DepEd Instructional Designer creating an official DepEd ILAW Lesson Plan (DepEd Order No. 3 s.2026).
CRITICAL REQUIREMENTS:
- Output EXACTLY ${count} SESSIONS in JSON format.
- In "learningObjectives", EVERY SINGLE session objective MUST be explicitly categorized into 3 distinct KSA domains:
  • Knowledge: [Cognitive domain objective]
  • Skills: [Psychomotor domain objective]
  • Attitude: [Affective domain objective]
- In "flow", use the STRICT 4As TEACHING APPROACH for EVERY session:
  • ACTIVITY: [Explicit group/pair diagnostic warm-up activity]
  • ANALYSIS: [Guided teacher questioning & student discovery]
  • ABSTRACTION: [Direct instruction, lecture, rules & concept summary]
  • APPLICATION: [Practical student task, exercise, or problem-solving]
- In "formativeAssessment", write VERBATIM 5-item test questionnaires with Answer Keys for each of the ${count} sessions.

Return ONLY raw JSON matching this format:
{
  "sessions": [${Array.from({ length: count }, (_, i) => `"Session ${i + 1}: [Topic]"`).join(", ")}],
  "intentions": {
    "learningObjectives": [${Array.from({ length: count }, () => `"• Knowledge: [Define/Identify concept]\\n• Skills: [Construct/Execute task]\\n• Attitude: [Values/Collaboration]"`).join(", ")}]
  },
  "learningExperience": {
    "preLesson": [${Array.from({ length: count }, (_, i) => `"Hook ${i + 1}"`).join(", ")}],
    "flow": [${Array.from({ length: count }, () => `"• ACTIVITY: [Warm-up activity]\\n• ANALYSIS: [Guided analysis prompts]\\n• ABSTRACTION: [Core lecture & rules]\\n• APPLICATION: [Hands-on application task]"`).join(", ")}],
    "learningResources": [${Array.from({ length: count }, (_, i) => `"Res ${i + 1}"`).join(", ")}],
    "opportunitiesForIntegration": [${Array.from({ length: count }, (_, i) => `"Integ ${i + 1}"`).join(", ")}]
  },
  "assessment": {
    "formativeAssessment": [${Array.from({ length: count }, (_, i) => `"Quiz ${i + 1} + Key"`).join(", ")}]
  },
  "waysForward": {
    "extendedLearning": [${Array.from({ length: count }, (_, i) => `"Ext ${i + 1}"`).join(", ")}],
    "reflections": [${Array.from({ length: count }, () => `""`).join(", ")}]
  }
}`;

            const uniqueToken = Date.now() + "_" + Math.floor(Math.random() * 999999);
            const userPrompt = `Generate a ${formData.noOfSessions} DepEd ILAW Lesson Plan using 4As Approach and KSA Objectives (Variation Token: ${uniqueToken}) for:
Topic / Lesson Title: ${formData.lessonTitle}
Subject/Learning Area: ${formData.learningArea}
Teacher: ${formData.teacherName}
Grade & Section: ${formData.gradeSection}
No. of Sessions: ${formData.noOfSessions}
Learning Competency: ${formData.learningCompetency}
Content Standard: ${formData.contentStandard}
Performance Standard: ${formData.performanceStandard}
Learner Context: ${formData.learnerContext}`;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${userApiKey.trim()}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                systemInstruction: { parts: [{ text: systemInstruction }] },
                contents: [{ parts: [{ text: userPrompt }] }],
                generationConfig: {
                  responseMimeType: "application/json",
                  temperature: 0.85
                }
              })
            });

            if (!response.ok) {
              const errJson = await response.json();
              console.warn("API Call Error, switching to offline generator:", errJson);
            } else {
              const data = await response.json();
              const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
              if (rawText) {
                setPlanData(JSON.parse(rawText));
                setLoading(false);
                return;
              }
            }
          } catch (err) {
            console.warn("Network Error, executing fallback engine.", err);
          }
        }

        setTimeout(() => {
          setPlanData(buildOfflinePlan(formData.lessonTitle, formData.learningArea, formData.gradeSection, formData.noOfSessions));
          setLoading(false);
        }, 400);
      };

      const downloadDocx = () => {
        const tableElement = document.getElementById("ilaw-table-container");
        if (!tableElement) return;

        const content = `
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <style>
              body { font-family: Arial, sans-serif; font-size: 9pt; }
              table { border-collapse: collapse; width: 100%; margin-top: 10px; }
              td, th { border: 1px solid #000000; padding: 6px; font-size: 9pt; vertical-align: top; white-space: pre-line; }
              .bg-header { background-color: #E2E8F0; font-weight: bold; }
              .bg-sub { background-color: #F1F5F9; font-weight: bold; }
              h2 { text-align: center; font-size: 14pt; font-weight: bold; margin-bottom: 2px; }
              p.subtitle { text-align: center; font-size: 9pt; color: #475569; margin-top: 0; margin-bottom: 15px; }
            </style>
          </head>
          <body>
            <h2>LESSON PLAN TEMPLATE (OFFICIAL ILAW - 4As APPROACH)</h2>
            <p class="subtitle">Department of Education - DepEd Order No. 3, s. 2026 Compliant Framework</p>
            ${tableElement.innerHTML}
          </body>
          </html>
        `;

        const converted = window.htmlDocx.asBlob(content, {
          orientation: 'landscape',
          margins: { top: 720, right: 720, bottom: 720, left: 720 }
        });

        const filename = `${(formData.lessonTitle || 'Lesson_Plan').replace(/[^a-zA-Z0-9]/g, '_')}_ILAW_4As.docx`;
        saveAs(converted, filename);
      };

      const sessionCount = planData.sessions?.length || 4;
      const totalColSpan = sessionCount + 1;

      return (
        <div className="min-h-screen flex flex-col relative">
          <header className="bg-blue-900 text-white shadow-md py-4 px-6 no-print flex justify-between items-center">
            <div className="flex items-center gap-3">
              <div className="bg-yellow-400 text-blue-950 font-black px-3 py-1 rounded tracking-wider text-xl">DepEd</div>
              <div>
                <h1 className="text-xl font-bold">ILAW Lesson Plan Generator (4As Framework)</h1>
                <p className="text-xs text-blue-200">Official DepEd Order No. 3, s. 2026 Compliant Format</p>
              </div>
            </div>
            
            <button 
              onClick={() => setShowDonateModal(true)}
              className="hidden sm:flex items-center gap-1.5 bg-blue-800 hover:bg-blue-700 text-yellow-300 border border-blue-600 text-xs py-1.5 px-3 rounded-lg font-semibold transition"
            >
              <span>☕</span> Buy the Dev Kape / Merienda
            </button>
          </header>

          <main className="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 p-6 max-w-[1700px] mx-auto w-full">
            {/* Input Form Controls */}
            <div className="lg:col-span-4 space-y-4 no-print h-fit">

              {/* Tagalog AI Good Vibes Joke Bar */}
              <div className="bg-amber-50 border border-amber-200 rounded-xl p-3.5 shadow-sm">
                <div className="flex justify-between items-center mb-1">
                  <span className="text-[11px] font-bold uppercase tracking-wider text-amber-800 flex items-center gap-1">
                    <span>😄</span> Teacher's Good Vibes Card
                  </span>
                  <button 
                    onClick={fetchNewJoke} 
                    disabled={jokeLoading}
                    className="text-[10px] bg-amber-200 hover:bg-amber-300 text-amber-900 font-bold px-2 py-0.5 rounded transition flex items-center gap-1"
                    title="Generate new AI Tagalog joke"
                  >
                    <span>{jokeLoading ? "⌛" : "✨"}</span> {jokeLoading ? "Thinking..." : "Hirit Pa!"}
                  </button>
                </div>
                <p className="text-xs text-amber-950 font-medium leading-relaxed italic">
                  "{jokeLoading ? "Naghahanap ng bagong panalong joke..." : currentJoke}"
                </p>
              </div>

              <div className="bg-white rounded-xl shadow-md border border-slate-200 p-5 space-y-4">
                <h2 className="text-lg font-bold text-slate-800 border-b pb-2">Lesson Inputs</h2>
                
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Lesson Title</label>
                  <input type="text" name="lessonTitle" value={formData.lessonTitle} onChange={handleChange} className="w-full text-sm p-2 bg-slate-50 border rounded outline-none focus:ring-1 focus:ring-blue-500" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Learning Area / Subject</label>
                  <input type="text" name="learningArea" value={formData.learningArea} onChange={handleChange} className="w-full text-sm p-2 bg-slate-50 border rounded outline-none focus:ring-1 focus:ring-blue-500" />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Teacher Name</label>
                    <input type="text" name="teacherName" value={formData.teacherName} onChange={handleChange} className="w-full text-sm p-2 bg-slate-50 border rounded outline-none focus:ring-1 focus:ring-blue-500" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Grade & Section</label>
                    <input type="text" name="gradeSection" value={formData.gradeSection} onChange={handleChange} className="w-full text-sm p-2 bg-slate-50 border rounded outline-none focus:ring-1 focus:ring-blue-500" />
                  </div>
                </div>

                {/* Session Count Dropdown */}
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">No. of Sessions</label>
                  <select 
                    name="noOfSessions" 
                    value={formData.noOfSessions} 
                    onChange={handleChange} 
                    className="w-full text-sm p-2 bg-slate-50 border rounded outline-none focus:ring-1 focus:ring-blue-500 font-medium"
                  >
                    <option value="1 Session">1 Session</option>
                    <option value="2 Sessions">2 Sessions</option>
                    <option value="3 Sessions">3 Sessions</option>
                    <option value="4 Sessions">4 Sessions</option>
                    <option value="5 Sessions">5 Sessions</option>
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Learning Competency</label>
                  <textarea name="learningCompetency" rows="2" value={formData.learningCompetency} onChange={handleChange} className="w-full text-sm p-2 bg-slate-50 border rounded resize-none outline-none focus:ring-1 focus:ring-blue-500" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Content Standard</label>
                  <textarea name="contentStandard" rows="2" value={formData.contentStandard} onChange={handleChange} className="w-full text-sm p-2 bg-slate-50 border rounded resize-none outline-none focus:ring-1 focus:ring-blue-500" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Performance Standard</label>
                  <textarea name="performanceStandard" rows="2" value={formData.performanceStandard} onChange={handleChange} className="w-full text-sm p-2 bg-slate-50 border rounded resize-none outline-none focus:ring-1 focus:ring-blue-500" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Learner Context</label>
                  <textarea name="learnerContext" rows="3" value={formData.learnerContext} onChange={handleChange} className="w-full text-sm p-2 bg-slate-50 border rounded resize-none outline-none focus:ring-1 focus:ring-blue-500" />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Gemini API Key (Optional for Live AI)</label>
                  <input 
                    type="password" 
                    placeholder="Paste AI Studio key (Saved locally on browser)..." 
                    value={userApiKey} 
                    onChange={handleApiKeyChange} 
                    className="w-full text-xs p-2 bg-slate-50 border rounded outline-none focus:ring-1 focus:ring-blue-500" 
                  />
                  <p className="text-[10px] text-slate-500 mt-1">Leave blank to use the universal offline generator.</p>
                </div>

                {/* Action Buttons */}
                <div className="flex gap-2 pt-2">
                  <button 
                    onClick={generatePlan} 
                    disabled={loading} 
                    className="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow transition flex items-center justify-center gap-1.5 text-xs sm:text-sm"
                  >
                    {loading ? "Generating..." : (hasGeneratedOnce ? "⚡ GENERATE VARIATION" : "⚡ GENERATE 4As LESSON PLAN")}
                  </button>
                  <button 
                    onClick={handleRefresh} 
                    type="button"
                    title="Reload Application Page"
                    className="px-4 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-lg shadow-sm transition text-xs sm:text-sm flex items-center gap-1"
                  >
                    <span>↻</span> Refresh
                  </button>
                </div>
              </div>
            </div>

            {/* Document Preview Panel */}
            <div className="lg:col-span-8 flex flex-col print-full-width">
              <div className="bg-white p-4 rounded-t-xl border border-b-0 flex justify-between items-center no-print">
                <span className="font-bold text-slate-800">ILAW Table Preview (4As Approach - {sessionCount} {sessionCount === 1 ? 'Session' : 'Sessions'})</span>
                <div className="flex gap-2">
                  <button onClick={downloadDocx} className="bg-blue-600 hover:bg-blue-700 text-white text-xs px-4 py-2 rounded font-medium shadow-sm transition flex items-center gap-1">
                    <span>📄</span> Download as .docx
                  </button>
                  <button onClick={() => window.print()} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-4 py-2 rounded font-medium shadow-sm transition flex items-center gap-1">
                    <span>🖨️</span> Print / PDF
                  </button>
                </div>
              </div>

              <div className="bg-white border p-6 rounded-b-xl shadow-sm print-full-width overflow-x-auto">
                <div className="min-w-[700px]" id="ilaw-table-container">
                  <table className="w-full border-collapse border border-slate-800 text-xs print-table">
                    <tbody>
                      <tr><td className="border border-slate-800 font-bold p-2 bg-slate-50">Lesson Title</td><td className="border border-slate-800 p-2" colSpan={sessionCount}>{formData.lessonTitle}</td></tr>
                      <tr><td className="border border-slate-800 font-bold p-2 bg-slate-50">Learning Area/s</td><td className="border border-slate-800 p-2" colSpan={sessionCount}>{formData.learningArea}</td></tr>
                      <tr><td className="border border-slate-800 font-bold p-2 bg-slate-50">Name of Teacher/s</td><td className="border border-slate-800 p-2" colSpan={sessionCount}>{formData.teacherName}</td></tr>
                      <tr><td className="border border-slate-800 font-bold p-2 bg-slate-50">Grade Level and Section</td><td className="border border-slate-800 p-2" colSpan={sessionCount}>{formData.gradeSection}</td></tr>
                      <tr><td className="border border-slate-800 font-bold p-2 bg-slate-50">No. of Sessions</td><td className="border border-slate-800 p-2" colSpan={sessionCount}>{formData.noOfSessions}</td></tr>
                      <tr><td className="border border-slate-800 font-bold p-2 bg-slate-50">References</td><td className="border border-slate-800 p-2" colSpan={sessionCount}>{formData.references}</td></tr>
                      <tr><td className="border border-slate-800 font-bold p-2 bg-slate-50">Declaration of AI use</td><td className="border border-slate-800 p-2" colSpan={sessionCount}>{formData.aiDeclaration}</td></tr>

                      <tr className="bg-slate-100"><td className="border border-slate-800 font-bold p-2 bg-header" colSpan={totalColSpan}>INTENTIONS.</td></tr>
                      <tr><td className="border border-slate-800 p-2 italic bg-slate-50" colSpan={totalColSpan}>Meaningful learning experiences are anchored in how we frame them. Start by deciding what you want learners to master by the end of the lesson - keep it clear and simple.</td></tr>
                      <tr>
                        <td className="border border-slate-800 font-bold p-2 bg-slate-50">Standards</td>
                        <td className="border border-slate-800 p-2" colSpan={sessionCount}>
                          <strong>Competency:</strong> {formData.learningCompetency}<br />
                          <strong>Content:</strong> {formData.contentStandard}<br />
                          <strong>Performance:</strong> {formData.performanceStandard}
                        </td>
                      </tr>

                      <tr className="bg-slate-200 font-bold text-center">
                        <td className="border border-slate-800 p-2 bg-sub">Component</td>
                        {planData.sessions.map((s, i) => <td key={i} className="border border-slate-800 p-2 bg-sub">{s}</td>)}
                      </tr>

                      <tr>
                        <td className="border border-slate-800 font-bold p-2 bg-slate-50">Learning Objectives (KSA)</td>
                        {planData.intentions.learningObjectives.map((item, i) => <td key={i} className="border border-slate-800 p-2 align-top whitespace-pre-line">{item}</td>)}
                      </tr>

                      <tr><td className="border border-slate-800 font-bold p-2 bg-slate-50">Learner Context</td><td className="border border-slate-800 p-2" colSpan={sessionCount}>{formData.learnerContext}</td></tr>

                      <tr className="bg-slate-100"><td className="border border-slate-800 font-bold p-2 bg-header" colSpan={totalColSpan}>LEARNING EXPERIENCE.</td></tr>
                      <tr>
                        <td className="border border-slate-800 font-bold p-2 bg-slate-50">Pre-Lesson</td>
                        {planData.learningExperience.preLesson.map((item, i) => <td key={i} className="border border-slate-800 p-2 align-top whitespace-pre-line">{item}</td>)}
                      </tr>
                      <tr>
                        <td className="border border-slate-800 font-bold p-2 bg-slate-50">Flow (4As Framework)</td>
                        {planData.learningExperience.flow.map((item, i) => <td key={i} className="border border-slate-800 p-2 align-top whitespace-pre-line">{item}</td>)}
                      </tr>
                      <tr>
                        <td className="border border-slate-800 font-bold p-2 bg-slate-50">Learning Resources</td>
                        {planData.learningExperience.learningResources.map((item, i) => <td key={i} className="border border-slate-800 p-2 align-top whitespace-pre-line">{item}</td>)}
                      </tr>
                      <tr>
                        <td className="border border-slate-800 font-bold p-2 bg-slate-50">Integration</td>
                        {planData.learningExperience.opportunitiesForIntegration.map((item, i) => <td key={i} className="border border-slate-800 p-2 align-top whitespace-pre-line">{item}</td>)}
                      </tr>

                      <tr className="bg-slate-100"><td className="border border-slate-800 font-bold p-2 bg-header" colSpan={totalColSpan}>ASSESSMENT.</td></tr>
                      <tr>
                        <td className="border border-slate-800 font-bold p-2 bg-slate-50">Formative Assessment</td>
                        {planData.assessment.formativeAssessment.map((item, i) => <td key={i} className="border border-slate-800 p-2 align-top whitespace-pre-line text-xs bg-slate-50">{item}</td>)}
                      </tr>

                      <tr className="bg-slate-100"><td className="border border-slate-800 font-bold p-2 bg-header" colSpan={totalColSpan}>WAYS FORWARD.</td></tr>
                      <tr>
                        <td className="border border-slate-800 font-bold p-2 bg-slate-50">Extended Learning</td>
                        {planData.waysForward.extendedLearning.map((item, i) => <td key={i} className="border border-slate-800 p-2 align-top whitespace-pre-line">{item}</td>)}
                      </tr>
                      <tr>
                        <td className="border border-slate-800 font-bold p-2 bg-slate-50">Reflections</td>
                        {planData.waysForward.reflections.map((item, i) => <td key={i} className="border border-slate-800 p-2 h-12"></td>)}
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </main>

          {/* Footer Banner */}
          <footer className="mt-8 mb-6 px-6 text-center no-print">
            <div className="max-w-xl mx-auto bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
              <p className="text-xs text-slate-700 leading-relaxed">
                ☕ <strong>Enjoying this free tool?</strong> Built by a fellow teacher to save us hours of DepEd paperwork. If this app helped you today, a small GCash token for coffee or snack is deeply appreciated! 
                <br />
                <span className="font-semibold text-blue-900 mt-1 inline-block">GCash: <span className="font-mono font-bold text-blue-700">09092593030</span> (Carlos C. Monderin)</span>
              </p>
            </div>
          </footer>

          {/* Floating Support Button */}
          <div className="fixed bottom-5 right-5 z-40 no-print">
            <button 
              onClick={() => setShowDonateModal(true)}
              className="bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs py-2.5 px-4 rounded-full shadow-lg transition flex items-center gap-2 border border-amber-300 transform hover:scale-105"
            >
              <span>☕</span>
              <span>Treat Dev to Coffee</span>
            </button>
          </div>

          {/* Support Modal */}
          {showDonateModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 no-print">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative border border-slate-100 text-center">
                <button 
                  onClick={() => setShowDonateModal(false)}
                  className="absolute top-3 right-3 text-slate-400 hover:text-slate-600 font-bold p-1 rounded-full text-base"
                >
                  ✕
                </button>

                <div className="text-3xl mb-1">💙</div>
                <h3 className="text-lg font-bold text-slate-800">Teachers Supporting Teachers</h3>
                <p className="text-xs text-slate-600 mt-2 leading-relaxed">
                  Hi! I'm <strong>Carlos C. Monderin</strong>. I created this web application to help fellow Filipino educators simplify their lesson preparation and save precious hours on paperwork.
                </p>
                <p className="text-xs text-slate-600 mt-2 leading-relaxed">
                  This tool will always remain <strong>100% free</strong>. If it brought ease to your teaching prep today and you'd like to chip in for coffee or merienda, any small amount is warmly appreciated!
                </p>

                <div className="bg-blue-50 border border-blue-200 rounded-xl p-4 my-4">
                  <span className="text-[10px] uppercase font-bold tracking-wider text-blue-600 block mb-1">GCash Support</span>
                  <div className="text-xl font-mono font-bold text-blue-950 tracking-wider">0909 259 3030</div>
                  <div className="text-xs font-semibold text-slate-700 mt-0.5">Carlos C. Monderin</div>
                </div>

                <p className="text-[11px] text-slate-400 italic">
                  Kahit simple prayer or thank you lang, sapat na po! Happy teaching! 🙏
                </p>

                <button 
                  onClick={() => setShowDonateModal(false)}
                  className="mt-4 w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs rounded-lg transition"
                >
                  Back to Planner
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
