<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DepEd ILAW Lesson Plan Generator (Detailed & Dynamic Framework)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- html-docx-js for native .docx generation -->
  <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.min.js"></script>
  
  <!-- FileSaver.js for file saving -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  
  <style>
    @media print {
      body {
        background-color: white !important;
        color: black !important;
      }
      .no-print {
        display: none !important;
      }
      .print-full-width {
        width: 100% !important;
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .print-table {
        border-collapse: collapse !important;
        width: 100% !important;
      }
      .print-table th, .print-table td {
        border: 1px solid #000 !important;
        padding: 6px !important;
        color: #000 !important;
      }
      @page {
        size: A4 landscape;
        margin: 10mm;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_FORM_DATA = {
      lessonTitle: 'Verbs (Action Words)',
      learningArea: 'English / Language Arts',
      teacherName: 'CARLOS C. MONDERIN',
      gradeSection: 'Grade 7 – LOYALTY',
      noOfSessions: '4 Sessions',
      learningCompetency: 'The learner identifies and uses verbs correctly in sentences to express actions, states, and conditions.',
      contentStandard: 'The learner demonstrates understanding of English grammar conventions and sentence structure.',
      performanceStandard: 'The learner correctly constructs oral and written sentences using appropriate action verbs.',
      references: 'DepEd English Curriculum Guide, Learner\'s Material Module 2',
      aiDeclaration: 'Generated with the assistance of Gemini AI in compliance with DepEd DO 3 s.2026 Annex A for instructional design framing and activity structuring.',
      learnerContext: 'The class consists of Grade 7 learners with diverse language backgrounds. Most respond well to interactive visual games, roleplay, and sentence-building drills.'
    };

    const pickRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const getRandomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

    // Dynamic Offline Joke Synthesizer
    const generateDynamicOfflineJoke = () => {
      const questions = [
        "Ano ang paboritong subject ng",
        "Bakit laging masaya ang",
        "Anong sabi ng",
        "Bakit hindi nalulungkot ang",
        "Ano ang tawag sa",
        "Bakit paborito ng mga guro ang",
        "Anong ulam ang paborito ng",
        "Bakit maagang gumigising ang"
      ];

      const subjects = [
        { item: "mga sapatos", pun: "Kasi marami silang SOLE-id choices! 👟" },
        { item: "calculator", pun: "Kasi lagi silang pwedeng COUNT-on sa hirap at ginhawa! 🧮" },
        { item: "whiteboard marker", pun: "Kasi alam nilang make a MARK sila sa puso ng students! 🖊️" },
        { item: "mga kape sa faculty room", pun: "Kasi match na match ang TIMING nila sa breaktime! ☕" },
        { item: "kalendaryo", pun: "Kasi puno ang taon nila ng masayang DATES! 📅" },
        { item: "mga geometry teacher", pun: "Kasi nakikita nila ang pananaw sa tamang RIGHT ANGLE! 📐" },
        { item: "mga laptop charger", pun: "Kasi full of ENERGY sila magturo! 🔋" },
        { item: "mga electric fan sa classroom", pun: "Kasi NUMBER ONE FAN sila ng mga estudyante! 🌬️" },
        { item: "mga papel sa desk", pun: "Kasi aligned sila sa tamang MARGINS! 📄" },
        { item: "mga compass sa Math class", pun: "Kasi guide sila to the RIGHT DIRECTION! 🧭" },
        { item: "mga bell sa eskwelahan", pun: "Kasi RING nang RING ang Good Vibes sa kanila! 🔔" },
        { item: "mga libro sa library", pun: "Kasi marami silang PAGES of wisdom! 📚" }
      ];

      return `${pickRandom(questions)} ${pickRandom(subjects).item}? Edi ${pickRandom(subjects).pun}`;
    };

    // Topic-Aware Dynamic Offline Engine
    const buildOfflinePlan = (title, area, grade, numSessionsText = "4 Sessions") => {
      const T = title?.trim() || "the Lesson Topic";
      const S = (area?.trim() || "").toLowerCase();
      const G = grade?.trim() || "the Class";
      const runId = Math.floor(Math.random() * 9000) + 1000;

      const count = parseInt(numSessionsText) || 4;

      const sessionFocusPool = [
        ["Core Concepts & Discovery", "Foundational Principles"],
        ["Structural Patterns & Analysis", "Rules & Formulations"],
        ["Guided Practice & Error Checking", "Collaborative Drills"],
        ["Real-World Application & Workshop", "Practical Synthesis"],
        ["Summative Mastery Check", "Formal Performance Evaluation"]
      ];

      const sessions = Array.from({ length: count }, (_, i) => 
        `Session ${i + 1}: ${pickRandom(sessionFocusPool[i % sessionFocusPool.length])} of ${T}`
      );

      const ksaObjectivesPool = [
        `• Knowledge: Define core principles of ${T} and explain its role in ${S}.\n• Skills: Identify and categorize target elements of ${T} across 5 practice exercises.\n• Attitude: Demonstrate active curiosity and respectful listening during group discussions.`,
        `• Knowledge: State structural rules and governing standards for ${T}.\n• Skills: Construct original examples demonstrating accurate application of ${T}.\n• Attitude: Exercise patience and precision during guided problem solving.`,
        `• Knowledge: Analyze sample student outputs to identify common errors in ${T}.\n• Skills: Correct structural misconceptions in partner-based review sheets.\n• Attitude: Collaborate constructively and offer encouraging peer feedback.`,
        `• Knowledge: Synthesize key rules of ${T} within real-world context.\n• Skills: Produce a rubric-evaluated task sheet demonstrating mastery of ${T}.\n• Attitude: Take pride in delivering neat and accurate academic work.`,
        `• Knowledge: Recall foundational concepts of ${T} under timed evaluation.\n• Skills: Execute a formal 5-item assessment with at least 80% accuracy.\n• Attitude: Maintain academic integrity and self-discipline during assessment.`
      ];

      const hookStyles = [
        `1. Visual Diagnostic (4 mins): Display 3 contrasting board examples of ${T}. Ask: "What distinguishes these items?"\n2. Lesson Goal Briefing: State performance targets.`,
        `1. Interactive Roleplay / Charade (4 mins): Call 2 volunteers to demonstrate a real-world scenario involving ${T}.\n2. Inquiry Prompt: Connect demo to today's topic.`,
        `1. Spot-the-Error Challenge (4 mins): Flash 3 incorrect statements involving ${T}. Challenge class to fix them.\n2. Review baseline rules.`,
        `1. Authentic Case Prompt (4 mins): Present a scenario in ${G} where ${T} is applied. Ask: "Why does precision matter here?"\n2. Group warm-up.`
      ];

      // Dynamic 4As Flow Generator
      const activityVariants = [
        (sNum) => `1. ACTIVITY (10 mins):\n• Interactive Card Sorting (Set #${runId}-${sNum}): Divide class into 4 teams. Distribute 6 envelope cards featuring diverse examples of ${T}.\n• Task: Teams sort and attach cards under appropriate columns on the board within 7 minutes.\n• Teacher Role: Observe team dynamics and guide groups struggling with classification.`,
        (sNum) => `1. ACTIVITY (10 mins):\n• Classroom Charades & Log (Set #${runId}-${sNum}): 4 student volunteers act out scenario prompts related to ${T}.\n• Task: Non-acting learners log observed key action patterns on graphic organizer sheets.\n• Group Action: Teams post their completed observation sheets on the main wall.`,
        (sNum) => `1. ACTIVITY (10 mins):\n• Spot-the-Mistake Gallery Walk (Set #${runId}-${sNum}): Post 4 posters containing deliberate errors in ${T} around the room.\n• Task: Pairs rotate with highlighters, tagging structural flaws on each poster within 6 minutes.\n• Outcome: Teams summarize identified errors on sticky notes.`,
        (sNum) => `1. ACTIVITY (10 mins):\n• Concept Puzzle Assembly (Set #${runId}-${sNum}): Distribute envelopes containing cut-out structural pieces of ${T}.\n• Task: Groups reassemble fragments into complete, logical representations.\n• Verification: Teacher inspects and validates table layouts before debrief.`
      ];

      const analysisVariants = [
        (sNum) => `2. ANALYSIS (10 mins):\n• Guided Inquiry: Teacher asks: "What common structural features distinguish the correctly sorted cards in Category A?"\n• Student Rationale: Team representatives explain their classification logic.\n• Probing Questions: "How does altering element X change the overall meaning of ${T}?"\n• Board Work: Teacher records student-identified keywords into a central web.`,
        (sNum) => `2. ANALYSIS (10 mins):\n• Comparative Analysis: Project side-by-side examples of correct vs. flawed applications of ${T}.\n• Student Discussion: Ask: "Which rule was breached in Sample B, and how does it impact accuracy in ${S}?"\n• Synthesis: Class formulates 2 corrective guidelines based on peer responses.`,
        (sNum) => `2. ANALYSIS (10 mins):\n• Facilitated Peer Debrief: Call on 2 group leaders to defend conflicting answers from the warm-up task.\n• Class Consensus: Guide learners to determine which representation strictly follows standard rules of ${T}.\n• Teacher Key Note: Emphasize the underlying principle governing target usages.`
      ];

      const abstractionVariants = [
        (sNum) => `3. ABSTRACTION (15 mins):\n• Direct Mini-Lecture: Present formal definitions, core categories, and governing rules of ${T}.\n• Board Modeling: Teacher models solving/constructing 3 complex examples step-by-step on the main board.\n• Common Pitfalls: Highlight top 2 student misconceptions in ${S} and demonstrate instant correction strategies.\n• Student Notebooks: Learners transcribe master rules and visual formula maps.`,
        (sNum) => `3. ABSTRACTION (15 mins):\n• Concept Map & Golden Rules: Synthesize student findings into a structured flowchart for ${T}.\n• Rule Formulation: Class collaboratively drafts 3 "Golden Rules" for using ${T} in Grade ${G}.\n• Rubric Walkthrough: Break down a top-scoring sample output and explain criteria alignment.\n• Q&A Segment: Address remaining student questions prior to independent practice.`,
        (sNum) => `3. ABSTRACTION (15 mins):\n• Interactive Demonstration & Cheat-Sheet Review: Distribute 1-page reference summaries on ${T}.\n• Guided Walkthrough: Unpack core concepts line-by-line with active student participation.\n• Student Board Work: Call 3 random learners to construct sample board tasks using reference cards.`
      ];

      const applicationVariants = [
        (sNum) => `4. APPLICATION (10 mins):\n• Paired Task Sheet ${sNum}: Student pairs complete 5 original construction/identification items applying ${T}.\n• Teacher Supervision: Circulate through rows to offer real-time corrective feedback.\n• Peer Evaluation: Swap worksheets with neighboring pairs for rubric-based checking.`,
        (sNum) => `4. APPLICATION (10 mins):\n• Individual Performance Task: Learners independently write/construct a 5-item output applying ${T}.\n• Rubric Scoring: Evaluated on Accuracy (2 pts), Formatting (2 pts), and Timeliness (1 pt).\n• Verbal Sharing: 3 selected learners present outputs aloud for immediate teacher validation.`,
        (sNum) => `4. APPLICATION (10 mins):\n• Real-World Transfer Activity: Prompt: "Draft a brief 4-sentence scenario in Grade ${G} context applying ${T} accurately."\n• Peer Review: Trios check peer drafts using a 3-point verification checklist.\n• File Deposit: Completed tasks collected for learner portfolio assessment.`
      ];

      const generate4AFlow = (i) => {
        const sNum = i + 1;
        const act = pickRandom(activityVariants)(sNum);
        const ana = pickRandom(analysisVariants)(sNum);
        const abs = pickRandom(abstractionVariants)(sNum);
        const app = pickRandom(applicationVariants)(sNum);

        return `${act}\n\n${ana}\n\n${abs}\n\n${app}`;
      };

      // TOPIC-SPECIFIC INTEGRATION POOL
      const integrationVariants = [
        (sNum) => `• DepEd Core Value Integration: Maka-Tao - Emphasizes respectful collaboration and active listening while reviewing ${T} in peer pairs.\n` +
                 `• Cross-Curricular Link: Values Education (EsP) - Connects precision in using ${T} to taking personal responsibility for clear, truthful communication.\n` +
                 `• 21st Century Skills: Critical Thinking & Collaboration - Students analyze, classify, and evaluate sample cases of ${T} in teams.`,
        
        (sNum) => `• DepEd Core Value Integration: Makabansa - Uses community-based and national scenario prompts when constructing examples of ${T}.\n` +
                 `• Cross-Curricular Link: Araling Panlipunan - Links concepts of ${T} to analyzing local civic duties and social contexts.\n` +
                 `• 21st Century Skills: Effective Communication & Media Literacy - Learners construct clear statements and evaluate textual accuracy.`,
        
        (sNum) => `• DepEd Core Value Integration: Maka-Diyos - Promotes honesty, academic integrity, and self-discipline during independent practice on ${T}.\n` +
                 `• Cross-Curricular Link: Science & Mathematics - Applies systematic classification and step-by-step logical reasoning to ${T}.\n` +
                 `• 21st Century Skills: Problem Solving & Analytical Reasoning - Students spot structural flaws and debug errors in ${T}.`,
        
        (sNum) => `• DepEd Core Value Integration: Makakalikasan - Incorporates environmental awareness scenarios into workshop prompts for ${T}.\n` +
                 `• Cross-Curricular Link: Health & Physical Education - Utilizes active physical roleplay and kinesthetic exercises to demonstrate ${T}.\n` +
                 `• 21st Century Skills: Creative Innovation & Adaptability - Learners formulate original applications of ${T} for real-life situations.`
      ];

      // TOPIC-SPECIFIC FORMATIVE ASSESSMENT POOL (VERBATIM 5-ITEM TESTS + ANSWER KEYS)
      const formativeAssessmentVariants = [
        (sNum) => `EXPLICIT 5-ITEM IDENTIFICATION QUIZ (Set #${runId}-${sNum}):\n` +
                 `Instructions: Identify the correct application of ${T} in each item below.\n` +
                 `1. Identify the core element of ${T} in item #1. -> Key: [Target Element 1]\n` +
                 `2. Which word/concept represents ${T} in a standard context? -> Key: [Target Element 2]\n` +
                 `3. Underline the structural component of ${T} in the given sample. -> Key: [Target Element 3]\n` +
                 `4. True or False: ${T} changes form depending on context rules. -> Key: True\n` +
                 `5. Select the proper usage of ${T}: A) Incorrect  B) Correct -> Key: B\n\n` +
                 `Scoring Guide: 1 point per correct answer (Total: 5 points).`,

        (sNum) => `EXPLICIT 5-ITEM MULTIPLE CHOICE ASSESSMENT (Set #${runId}-${sNum}):\n` +
                 `Instructions: Write the letter of the correct answer on your quiz paper.\n` +
                 `1. What is the primary function of ${T} in ${S}?\n` +
                 `   A) Secondary modifier  B) Primary core component [KEY]  C) Auxiliary note\n` +
                 `2. Which option demonstrates the correct application of ${T}?\n` +
                 `   A) Sample Option A  B) Sample Option B [KEY]  C) Sample Option C\n` +
                 `3. Identify the error in the statement involving ${T}:\n` +
                 `   A) Subject placement  B) Structural misapplication [KEY]  C) Punctuation\n` +
                 `4. Which rule must be followed when constructing outputs for ${T}?\n` +
                 `   A) Standard Rule 1 [KEY]  B) Outdated Convention  C) Optional Guideline\n` +
                 `5. Complete the statement: "Proper use of ${T} ensures _____."\n` +
                 `   A) confusion  B) structural clarity [KEY]  C) irrelevance`,

        (sNum) => `EXPLICIT 5-ITEM ERROR CORRECTION DRILL (Set #${runId}-${sNum}):\n` +
                 `Instructions: Rewrite each item to correct the underlined mistake in ${T}.\n` +
                 `1. Incorrect usage sample 1 of ${T}. -> Key: [Corrected Form 1]\n` +
                 `2. Incorrect usage sample 2 of ${T}. -> Key: [Corrected Form 2]\n` +
                 `3. Incorrect usage sample 3 of ${T}. -> Key: [Corrected Form 3]\n` +
                 `4. Incorrect usage sample 4 of ${T}. -> Key: [Corrected Form 4]\n` +
                 `5. Incorrect usage sample 5 of ${T}. -> Key: [Corrected Form 5]\n\n` +
                 `Scoring Guide: 1 point per corrected item (Total: 5 points).`,

        (sNum) => `EXPLICIT 5-POINT PERFORMANCE TASK RUBRIC (Set #${runId}-${sNum}):\n` +
                 `Task: Construct an original 5-item output demonstrating mastery of ${T}.\n` +
                 `• Criteria 1: Accuracy & Rule Adherence (2 pts)\n` +
                 `  - 2 pts: Zero structural errors in target topic (${T}).\n` +
                 `  - 1 pt: Minor error, overall meaning remains intact.\n` +
                 `• Criteria 2: Content Alignment & Context (2 pts)\n` +
                 `  - 2 pts: All items directly apply ${T} in Grade ${G} context.\n` +
                 `  - 1 pt: Partial alignment with topic guidelines.\n` +
                 `• Criteria 3: Mechanics & Timeliness (1 pt)\n` +
                 `  - 1 pt: Clean formatting, submitted on schedule.`
      ];

      // TOPIC-SPECIFIC EXTENDED LEARNING POOL (REMEDIATION & ENRICHMENT)
      const extendedLearningVariants = [
        (sNum) => `• REMEDIATION (Struggling Learners):\n` +
                 `  - Provide Differentiated Guided Worksheet ${sNum}-B featuring a word bank and structural visual cues for ${T}.\n` +
                 `  - Conduct a 10-minute teacher-led small-group table review focusing on core definitions of ${T}.\n` +
                 `  - Pair struggling student with a designated "Peer Tutor" for 5 additional guided drills.\n\n` +
                 `• ENRICHMENT (Advanced Learners):\n` +
                 `  - Challenge learners to compose a short 5-item original scenario paragraph applying complex variations of ${T}.\n` +
                 `  - Appoint advanced student as "Peer Checker Captain" to assist the teacher in verifying group answers.`,

        (sNum) => `• REMEDIATION (Struggling Learners):\n` +
                 `  - Assign a targeted re-reading of Curriculum Guide reference pages on ${T} with highlighted key terms.\n` +
                 `  - Supply 3 simplified flashcard sets for mandatory consultation hour re-checking.\n` +
                 `  - Execute an oral re-quiz using simplified prompt cards for ${T}.\n\n` +
                 `• ENRICHMENT (Advanced Learners):\n` +
                 `  - Task learners to design an original mini-poster or infographic summarizing 3 golden rules of ${T}.\n` +
                 `  - Instruct student to formulate 3 diagnostic quiz items with complete answer explanations.`,

        (sNum) => `• REMEDIATION (Struggling Learners):\n` +
                 `  - Provide a color-coded step-by-step checklist breaking down how to identify and construct ${T}.\n` +
                 `  - Conduct a targeted 1-on-1 feedback session during independent study time.\n` +
                 `  - Assign 3 entry-level reinforcement items for home review.\n\n` +
                 `• ENRICHMENT (Advanced Learners):\n` +
                 `  - Assign an authentic real-world research prompt: "Find and critique 3 community examples of ${T}."\n` +
                 `  - Lead a brief student presentation sharing real-world insights with the class.`
      ];

      return {
        sessions: sessions,
        intentions: {
          learningObjectives: Array.from({ length: count }, (_, i) => ksaObjectivesPool[i % ksaObjectivesPool.length])
        },
        learningExperience: {
          preLesson: Array.from({ length: count }, () => pickRandom(hookStyles)),
          flow: Array.from({ length: count }, (_, i) => generate4AFlow(i)),
          learningResources: Array.from({ length: count }, (_, i) => 
            `• ${S} Curriculum Guide\n• Printed 4As Activity Cards ${i + 1}\n• Task Sheet & Board Markers`
          ),
          opportunitiesForIntegration: Array.from({ length: count }, (v, i) => pickRandom(integrationVariants)(i + 1))
        },
        assessment: {
          formativeAssessment: Array.from({ length: count }, (v, i) => pickRandom(formativeAssessmentVariants)(i + 1))
        },
        waysForward: {
          extendedLearning: Array.from({ length: count }, (v, i) => pickRandom(extendedLearningVariants)(i + 1)),
          reflections: Array.from({ length: count }, () => "")
        }
      };
    };

    function App() {
      const [formData, setFormData] = useState(DEFAULT_FORM_DATA);
      const [hasGeneratedOnce, setHasGeneratedOnce] = useState(false);
      const [currentJoke, setCurrentJoke] = useState("Loading Good Vibes Joke...");
      const [jokeLoading, setJokeLoading] = useState(false);
      
      const [planData, setPlanData] = useState(() => 
        buildOfflinePlan(DEFAULT_FORM_DATA.lessonTitle, DEFAULT_FORM_DATA.learningArea, DEFAULT_FORM_DATA.gradeSection, DEFAULT_FORM_DATA.noOfSessions)
      );
      
      const [loading, setLoading] = useState(false);
      const [showDonateModal, setShowDonateModal] = useState(false);

      const [userApiKey, setUserApiKey] = useState(() => {
        return localStorage.getItem('deped_gemini_key') || '';
      });

      const fetchNewJoke = async () => {
        setJokeLoading(true);

        if (userApiKey && userApiKey.trim() !== '') {
          try {
            const prompt = `Give me 1 short, funny, wholesome Tagalog teacher or school-related one-liner joke with emojis. Do not add introductory text or quotes. Just the raw joke text. Random Seed: ${Date.now()}`;
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${userApiKey.trim()}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { temperature: 0.9, maxOutputTokens: 100 }
              })
            });

            if (response.ok) {
              const data = await response.json();
              const jokeText = data.candidates?.[0]?.content?.parts?.[0]?.text;
              if (jokeText) {
                setCurrentJoke(jokeText.trim());
                setJokeLoading(false);
                return;
              }
            }
          } catch (err) {
            console.warn("AI Joke fetch failed, falling back to dynamic generator.", err);
          }
        }

        setTimeout(() => {
          setCurrentJoke(generateDynamicOfflineJoke());
          setJokeLoading(false);
        }, 300);
      };

      useEffect(() => {
        fetchNewJoke();
      }, []);

      const handleApiKeyChange = (e) => {
        const key = e.target.value;
        setUserApiKey(key);
        localStorage.setItem('deped_gemini_key', key);
      };

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const handleRefresh = () => {
        window.location.reload();
      };

      const generatePlan = async () => {
        setLoading(true);
        setHasGeneratedOnce(true);
        const count = parseInt(formData.noOfSessions) || 4;

        if (userApiKey && userApiKey.trim() !== '') {
          try {
            const systemInstruction = `You are an expert DepEd Instructional Designer creating an official DepEd ILAW Lesson Plan (DepEd Order No. 3 s.2026).
CRITICAL REQUIREMENTS FOR HIGHLY SPECIFIC CONTENT:
- Output EXACTLY ${count} SESSIONS in JSON format.
- In "flow", generate DETAILED, BRAND NEW 4As ACTIVITIES (Activity, Analysis, Abstraction, Application) tailored directly to "${formData.lessonTitle}".
- In "learningObjectives", EVERY SINGLE session objective MUST be explicitly categorized into 3 distinct KSA domains:
  • Knowledge: [Cognitive objective]
  • Skills: [Psychomotor objective]
  • Attitude: [Affective objective]
- In "opportunitiesForIntegration", generate TOPIC-SPECIFIC:
  • DepEd Core Value Integration (Maka-Diyos, Maka-Tao, Makakalikasan, or Makabansa)
  • Cross-Curricular Link (Specific subject link like EsP, AP, Science, Math)
  • 21st Century Skills (Critical Thinking, Collaboration, Communication)
- In "formativeAssessment", write VERBATIM 5-ITEM QUIZZES WITH COMPLETE ANSWER KEYS specifically tailored to "${formData.lessonTitle}" for each session.
- In "waysForward" -> "extendedLearning", provide DETAILED STEP-BY-STEP strategies specifically for "${formData.lessonTitle}":
  • REMEDIATION (Struggling Learners: worksheets, peer tutoring, table review)
  • ENRICHMENT (Advanced Learners: creative prompts, peer checker roles, infographics)

Return ONLY raw JSON matching this format:
{
  "sessions": [${Array.from({ length: count }, (_, i) => `"Session ${i + 1}: [Subtopic]"`).join(", ")}],
  "intentions": {
    "learningObjectives": [${Array.from({ length: count }, () => `"• Knowledge: [Cognitive]\\n• Skills: [Psychomotor]\\n• Attitude: [Affective]"`).join(", ")}]
  },
  "learningExperience": {
    "preLesson": [${Array.from({ length: count }, (_, i) => `"Hook ${i + 1}"`).join(", ")}],
    "flow": [${Array.from({ length: count }, () => `"1. ACTIVITY (10 mins): [Detailed Activity]\\n\\n2. ANALYSIS (10 mins): [Detailed Analysis prompts]\\n\\n3. ABSTRACTION (15 mins): [Detailed Abstraction summary]\\n\\n4. APPLICATION (10 mins): [Detailed Application task]"`).join(", ")}],
    "learningResources": [${Array.from({ length: count }, (_, i) => `"Res ${i + 1}"`).join(", ")}],
    "opportunitiesForIntegration": [${Array.from({ length: count }, () => `"• DepEd Core Value Integration: [Specific Value link]\\n• Cross-Curricular Link: [Specific Subject link]\\n• 21st Century Skills: [Specific Skill link]"`).join(", ")}]
  },
  "assessment": {
    "formativeAssessment": [${Array.from({ length: count }, () => `"EXPLICIT 5-ITEM QUIZ:\\n1. [Item 1] -> Key: [Ans]\\n2. [Item 2] -> Key: [Ans]\\n3. [Item 3] -> Key: [Ans]\\n4. [Item 4] -> Key: [Ans]\\n5. [Item 5] -> Key: [Ans]"`).join(", ")}]
  },
  "waysForward": {
    "extendedLearning": [${Array.from({ length: count }, () => `"• REMEDIATION (Struggling Learners): [Specific steps]\\n\\n• ENRICHMENT (Advanced Learners): [Specific tasks]"`).join(", ")}],
    "reflections": [${Array.from({ length: count }, () => `""`).join(", ")}]
  }
}`;

            const uniqueToken = Date.now() + "_" + Math.floor(Math.random() * 999999);
            const userPrompt = `Generate a fresh, unique, highly detailed 4As variation (Token: ${uniqueToken}) for a ${formData.noOfSessions} DepEd ILAW Lesson Plan:
Topic / Lesson Title: ${formData.lessonTitle}
Subject/Learning Area: ${formData.learningArea}
Teacher: ${formData.teacherName}
Grade & Section: ${formData.gradeSection}
No. of Sessions: ${formData.noOfSessions}
Learning Competency: ${formData.learningCompetency}
Content Standard: ${formData.contentStandard}
Performance Standard: ${formData.performanceStandard}
Learner Context: ${formData.learnerContext}`;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${userApiKey.trim()}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                systemInstruction: { parts: [{ text: systemInstruction }] },
                contents: [{ parts: [{ text: userPrompt }] }],
                generationConfig: {
                  responseMimeType: "application/json",
                  temperature: 0.95
                }
              })
            });

            if (!response.ok) {
              const errJson = await response.json();
              console.warn("API Call Error, switching to offline generator:", errJson);
            } else {
              const data = await response.json();
              const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
              if (rawText) {
                setPlanData(JSON.parse(rawText));
                setLoading(false);
                return;
              }
            }
          } catch (err) {
            console.warn("Network Error, executing fallback engine.", err);
          }
        }

        setTimeout(() => {
          setPlanData(buildOfflinePlan(formData.lessonTitle, formData.learningArea, formData.gradeSection, formData.noOfSessions));
          setLoading(false);
        }, 400);
      };
